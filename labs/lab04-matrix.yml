# Lab 04 — Matrix builds
# Copy to: .github/workflows/ci.yml (replaces lab 03)
#
# One job definition expands into many parallel jobs. Watch the Actions
# tab: you get one row per combination, each on its own fresh runner.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        # Trim the grid: only run the old interpreter on Linux.
        exclude:
          - os: windows-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.10'
        # And add one extra combination with a flag of its own.
        include:
          - os: ubuntu-latest
            python-version: '3.13'
            coverage: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run tests with coverage
        if: matrix.coverage
        run: pytest --cov=pricekit --cov-report=term-missing

  # A single job downstream jobs can depend on, instead of listing
  # every matrix leg. Common pattern for branch protection rules.
  ci-ok:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any matrix leg failed
        run: |
          echo "test result: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ]
