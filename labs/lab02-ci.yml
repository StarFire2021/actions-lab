# Lab 02 — Real CI
# Copy to: .github/workflows/ci.yml
#
# Goal: the smallest workflow that is actually useful.
# Note the first step: without checkout, the runner has no code.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Lint
        run: ruff check .
