# Lab 05 — Caching and job summaries
# Copy to: .github/workflows/ci.yml (replaces lab 04)
#
# Two ideas: make repeat runs faster, and make the run page readable
# without opening logs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-python has pip caching built in. It keys off the hash of
      # your dependency files automatically.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      # A manual cache, to see the mechanism directly. Watch the log for
      # "Cache restored" vs "Cache not found" between runs.
      - name: Cache ruff
        uses: actions/cache@v6
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ruff-${{ runner.os }}-

      - run: pip install -e ".[dev]"

      - name: Run tests
        id: tests
        run: |
          pytest --cov=pricekit --cov-report=term --junitxml=junit.xml | tee pytest-output.txt

      - name: Write the job summary
        if: always()
        run: |
          {
            echo "## Test results"
            echo ""
            echo '```'
            tail -20 pytest-output.txt
            echo '```'
            echo ""
            echo "Commit \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the price report
        run: |
          pricekit data/sample_prices.csv >> "$GITHUB_STEP_SUMMARY"
