# Lab 07 — Permissions, secrets, and safe expression handling
# Copy to: .github/workflows/pr-report.yml
#
# This workflow writes a comment back to the pull request, which means
# it needs a token with write access. Note that the elevated permission
# is granted at the JOB level, not the workflow level.

name: PR report

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Default for the whole file: read only.
permissions:
  contents: read

concurrency:
  group: pr-report-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # granted narrowly, only here
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -e ".[dev]"

      - name: Build report
        run: |
          mkdir -p reports
          pricekit data/sample_prices.csv -o reports/summary.md

      # UNSAFE — never do this. A PR titled with backticks executes on
      # your runner. Left here so you can see the shape of the bug:
      #
      #   - run: echo "Title: ${{ github.event.pull_request.title }}"
      #
      # SAFE — pass it through the environment, where it stays a value.
      - name: Echo the PR title safely
        run: |
          echo "Title length: ${#PR_TITLE}"
          echo "Title: $PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Comment on the PR
        env:
          # GITHUB_TOKEN is injected automatically; you never create it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file reports/summary.md

      # Demonstrates a user-supplied secret and log masking.
      # Add a repo secret named DEMO_SECRET first, then watch the log:
      # the value is replaced with ***.
      - name: Show masking
        if: ${{ secrets.DEMO_SECRET != '' }}
        env:
          DEMO: ${{ secrets.DEMO_SECRET }}
        run: |
          echo "The next line is masked:"
          echo "$DEMO"
          echo "But masking is literal string matching -- this leaks it:"
          echo "$DEMO" | base64
