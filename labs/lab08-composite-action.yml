# Lab 08a — Composite action
# Copy to: .github/actions/setup-project/action.yml
#
# Note the path: composite actions live under .github/actions/<name>/action.yml,
# NOT under .github/workflows/. The filename must be action.yml.

name: Setup project
description: Checkout, install Python, and install the project with dev deps.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: '3.12'
  install-extras:
    description: Whether to install the dev extras
    required: false
    default: 'true'

outputs:
  python-path:
    description: Absolute path to the interpreter that was installed
    value: ${{ steps.setup.outputs.python-path }}

runs:
  using: composite      # <- readable shell, not an opaque Docker image
  steps:
    - uses: actions/checkout@v7

    - id: setup
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'

    # Every run step in a composite action MUST declare its shell.
    - name: Install
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ inputs.install-extras }}" = "true" ]; then
          pip install -e ".[dev]"
        else
          pip install -e .
        fi
