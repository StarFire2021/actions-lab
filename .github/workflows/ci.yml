name: CI_TEST

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch: 

permissions:
  contents: read

concurrency: 
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        # Trim the grid: only run the old interpreter on Linux
        exclude:
          - os: windows-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.10'
        # And add one extra combination with a flag of its own.
        include:
          - os: ubuntu-latest
            python-version: '3.13'
            coverage: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run tests with coverage
        if: matrix.coverage
        run: pytest --cov=pricekit --cov-report=term-missing


  ci-ok:
    if: always()
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any matrix leg failed
        run: |
          echo "test result: ${{ needs.tests.result }}"
          [ "${{ needs.tests.result }}" = "success" ]


