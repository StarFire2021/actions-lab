name: CI_TEST

on:
  push:
    branches: [main]
  pull_request: 
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "$(pwd)" && ls -la
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest
  
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lint
        run: ruff check .