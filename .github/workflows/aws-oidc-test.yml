name: AWS OIDC test

on:
  workflow_dispatch:

permissions:
  id-token: write   # allows the job to request the OIDC JWT
  contents: read    # needed for checkout

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show OIDC claims (debug only)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | python3 -c "
          import sys, json, base64
          p = sys.stdin.read().strip().split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({k: c.get(k) for k in ('sub','aud','repository','repository_owner','ref','environment')}, indent=2))
          "

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4   # check releases for the latest major
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gh-${{ github.run_id }}

      - name: Prove it worked
        run: aws sts get-caller-identity
